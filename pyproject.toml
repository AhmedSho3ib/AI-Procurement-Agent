[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-procurement-agent"
version = "1.0.0"
description = "Production-grade multi-agent AI procurement research agent (CrewAI + FastAPI)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "AI Engineering" }]
keywords = ["ai", "agents", "crewai", "fastapi", "rag", "procurement", "llm"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    # AI orchestration + model provider
    "crewai>=1.15,<2.0",
    "google-genai>=1.0,<3.0",
    # External system SDKs used by the stores layer
    "tavily-python>=0.5,<1.0",
    "scrapegraph-py>=1.47,<3.0",
    # Observability (optional at runtime, isolated in utils/observability.py)
    "agentops>=0.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<3.0",
]

[project.scripts]
procure = "src.cli:main"

[project.urls]
Homepage = "https://github.com/AhmedSho3ib/AI-Procurement-Agent"
Documentation = "https://github.com/AhmedSho3ib/AI-Procurement-Agent/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.services.procurement_service.prompts" = ["*.md"]
"src" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that exercise the FastAPI application end to end with mock providers",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/cli.py"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["notebooks", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "BLE"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Long lines in tests are usually data rows and parametrised expectations; the
# 110 character budget is enforced for application code, not for test data.
"tests/**" = ["ARG001", "ARG002", "S101", "E501"]
# The project architecture mandates PascalCase state files such as
# controllers/BaseController.py and stores/llm/LLMFactory.py. The architecture
# standard wins over the naming lint.
"src/controllers/BaseController.py" = ["N999"]
"src/stores/**" = ["N999"]
# Provider builders share one callable signature; unused parameters are required
# for a uniform registry.
"src/stores/**/*Factory.py" = ["ARG001", "ARG002"]

[tool.mypy]
# Runtime floor is Python 3.11 (see requires-python); ruff's py311 target enforces
# that our own source stays 3.11-compatible. mypy analysis runs with 3.12 because
# several third-party stubs in the dependency tree use 3.12-only syntax, which a
# 3.11 analysis cannot even parse.
python_version = "3.12"
mypy_path = "."
packages = ["src"]
strict = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
ignore_missing_imports = true

# Third-party SDKs are treated as opaque: we only care about the types of our own
# seams (interfaces, schemas). Some of these packages ship syntax that is newer
# than our minimum supported Python, so their contents must not be type-checked by
# our toolchain ("silent" keeps their public types while suppressing their errors).
[[tool.mypy.overrides]]
module = [
    "agentops.*",
    "crewai.*",
    "google.*",
    "litellm.*",
    "tavily.*",
]
follow_imports = "silent"

# These packages ship sources or stubs that only parse on Python >= 3.12, so their
# contents must not be parsed at all when type-checking against our 3.11 floor.
[[tool.mypy.overrides]]
module = ["numpy.*", "scrapegraph_py.*"]
follow_imports = "skip"
