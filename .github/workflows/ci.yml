name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Tests must never require real credentials. Mock providers are used everywhere.
  ENVIRONMENT: test
  LLM_PROVIDER: mock
  SEARCH_PROVIDER: mock
  SCRAPER_PROVIDER: mock
  REPORT_PROVIDER: jinja
  WORKFLOW: sequential
  PERSISTENCE_BACKEND: memory
  AGENTOPS_ENABLED: "false"

jobs:
  quality:
    name: Lint, typecheck and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Mypy
        run: python -m mypy
        continue-on-error: true

      - name: Pytest
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Smoke test (mock providers, no API keys)
        run: python scripts/smoke_test.py --output-dir "${RUNNER_TEMP}/procurement-smoke"

      - name: Verify no secrets are tracked
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          # Scan application code, scripts and infrastructure only. The test suite
          # intentionally contains credential-shaped strings (the redaction tests in
          # tests/unit/stores/test_provider_errors.py) and docs contain example UUIDs,
          # so those paths are excluded to keep this check meaningful.
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}|tvly-[0-9A-Za-z]{20,}|sgai-[0-9A-Za-z]{20,}|sk-[0-9A-Za-z]{20,}|AQ\.[0-9A-Za-z_.-]{20,}' \
              -- src scripts templates .github Dockerfile docker-compose.yml Makefile pyproject.toml '.env.example'; then
            echo "::error::Potential secret detected in tracked files"
            exit 1
          fi
          echo "No secrets detected in application code."

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-procurement-agent:ci .
